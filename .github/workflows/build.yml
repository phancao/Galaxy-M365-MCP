name: Build

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # KHÔNG self-hosted, dù trần chi tiêu Actions chặn job hosted (#8). Kho này
    # CÔNG KHAI: PR từ fork chạy workflow do NGƯỜI MỞ PR viết, nên chỉ cần một
    # runner đăng ký cho kho là họ đổi `runs-on` và chạy mã trên máy ấy. Runner
    # `galaxy` cũ nằm trên máy staging, chạy bằng user giữ token GitHub cá nhân
    # (~/.git-credentials, gh auth) — gỡ 24/09/2026. Job hosted bị chặn thì đỏ
    # với 0 bước; thế còn hơn một cửa mở vào máy.
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x, 20.x, 22.x ]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install patch-package (if needed)
        run: npm i -D patch-package

      - name: Install dependencies
        run: npm ci

      - name: Generate
        run: npm run generate

      - name: Lint code
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build TypeScript
        run: npm run build

      # vitest 4 requires Node >= 20, so tests run on 20+ only
      - name: Run tests
        if: matrix.node-version != '18.x'
        run: npm test

      # On Node 18 we still verify the built artifact starts and loads its modules
      - name: Smoke test (Node 18 runtime check)
        if: matrix.node-version == '18.x'
        run: node dist/index.js --list-presets
