name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    # KHÔNG self-hosted. Kho này CÔNG KHAI: PR từ fork chạy workflow do NGƯỜI
    # MỞ PR viết, nên chỉ cần một runner đăng ký cho kho là họ đổi `runs-on` và
    # chạy mã trên máy ấy. Runner `galaxy` cũ nằm trên máy staging, chạy bằng
    # user giữ token GitHub cá nhân (~/.git-credentials, gh auth) — gỡ
    # 24/09/2026. Và runner hosted MIỄN PHÍ cho kho công khai — trần chi tiêu
    # Actions của tài khoản (lý do của #8) không áp vào đây: #11 chạy đủ 3 job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm i -D patch-package
      - run: npm ci
      - run: npm run generate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
